name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate MCP artifact pins
        run: python3 scripts/validate-mcp-registry.py

      - name: Verify generated skill index
        run: |
          cp index.json "${RUNNER_TEMP}/index.before.json"
          python3 scripts/generate-index.py
          jq -S 'del(.updated_at)' "${RUNNER_TEMP}/index.before.json" > "${RUNNER_TEMP}/index.before.normalized.json"
          jq -S 'del(.updated_at)' index.json > "${RUNNER_TEMP}/index.after.normalized.json"
          diff -u "${RUNNER_TEMP}/index.before.normalized.json" "${RUNNER_TEMP}/index.after.normalized.json"
